# 自动打测试包：main 有新提交（或手动触发）时跑本地三层验证
# （css lint / mock 桥 / JVM 单测）并构建 direct 调试包
# （com.feelime.ime.dev，与正式包共存），产物保留 7 天。
#
# 签名：默认走 Gradle 自动生成的 debug keystore（每次运行签名不同，
# 装机前需先卸载旧测试包）。如需多次构建互相覆盖升级，请在仓库
# Settings → Secrets and variables → Actions 里加四个 secret：
#   FEELIME_DEBUG_KEYSTORE          debug keystore 的 base64
#   FEELIME_DEBUG_STORE_PASSWORD    keystore 密码
#   FEELIME_DEBUG_KEY_ALIAS         key 别名
#   FEELIME_DEBUG_KEY_PASSWORD      key 密码
# 有这四个 secret 时工作流改用固定 keystore 签名，测试包可直接覆盖安装。
#
# 注意：不要用 android-actions/setup-android@v3（2026-11-12 在
# WenPrivacyGuard 的 CI 里该步骤 10 秒内无明确原因失败，编译根本没跑
# 起来）。这里只用 runner 自带的 Android SDK + sdkmanager 补装。
name: Build test APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "models/**"
      - "scripts/setup-assets.sh"
      - "scripts/package-keyboard.sh"
      - ".github/workflows/build-test-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node (JS verification suite)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$HOME/Android/Sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          if [ ! -d "$SDK/cmdline-tools/latest" ]; then
            echo "No preinstalled SDK cmdline-tools; installing to $SDK"
            mkdir -p "$SDK/cmdline-tools"
            cd /tmp
            curl -fL -o cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q cmdtools.zip -d "$SDK/cmdline-tools/tmp"
            mv "$SDK/cmdline-tools/tmp/cmdline-tools" "$SDK/cmdline-tools/latest"
            rm -rf "$SDK/cmdline-tools/tmp" cmdtools.zip
          fi
          # `yes | sdkmanager` always ends with SIGPIPE (141) once the
          # consumer exits; under `pipefail` that alone fails the step.
          # Read sdkmanager's own exit code out of PIPESTATUS instead.
          set +o pipefail
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "sdkmanager --licenses failed: $LICENSE_STATUS" >&2
            exit 1
          fi
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.1.0" "platform-tools"

      - name: Cache build assets (sherpa AAR + ASR models)
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/feelime
            ~/.cache/feelime
          key: feelime-assets-${{ hashFiles('scripts/setup-assets.sh', 'models/manifest.json') }}
          restore-keys: |
            feelime-assets-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'app/build.gradle.kts', 'build.gradle.kts', 'settings.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Fetch build assets (sherpa AAR + models, SHA-256 verified)
        run: ./scripts/setup-assets.sh

      - name: Install esbuild (legacy-web gate needs it)
        # check_legacy_web.js looks for esbuild at $FEELIME_ESBUILD or
        # ~/.config/feelime/toolchain/esbuild. Pin 0.28.2: the checked-in
        # *.legacy.js files were generated with it, and the gate compares
        # byte-for-byte, so the version must match.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/feelime/toolchain"
          npm install esbuild@0.28.2 --prefix /tmp/esb
          cp /tmp/esb/node_modules/.bin/esbuild "$HOME/.config/feelime/toolchain/esbuild"
          "$HOME/.config/feelime/toolchain/esbuild" --version

      - name: JS verification (css lint + mock bridge tests)
        run: |
          node scripts/verify/css_lint.js
          node scripts/verify/mock_bridge_tests.js

      - name: Fixed debug keystore (when secrets are configured)
        # NOTE: `secrets` is not a valid context inside a step `if`
        # expression (GitHub rejects the workflow at parse time), so the
        # presence check happens in shell instead. Without the four
        # secrets the build falls back to Gradle's default debug keystore.
        env:
          KEYSTORE_B64: ${{ secrets.FEELIME_DEBUG_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.FEELIME_DEBUG_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FEELIME_DEBUG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FEELIME_DEBUG_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No fixed debug keystore configured; using Gradle default debug keystore."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > /tmp/feelime-debug.keystore
          {
            echo "FEELIME_DEBUG_KEYSTORE=/tmp/feelime-debug.keystore"
            echo "FEELIME_DEBUG_STORE_PASSWORD=$STORE_PASSWORD"
            echo "FEELIME_DEBUG_KEY_ALIAS=$KEY_ALIAS"
            echo "FEELIME_DEBUG_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Unit tests + build direct debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDirectDebug --stacktrace

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/direct/debug/app-direct-debug.apk
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/36.1.0/aapt2" dump badging "$APK" | head -1
          unzip -l "$APK" | grep -cE 'asr-model|final-model|punctuation|handwriting' || true

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: feelime-test-apk
          path: app/build/outputs/apk/direct/debug/app-direct-debug.apk
          retention-days: 7
          if-no-files-found: error

  # Fork 自有键盘热更通道：把当前键盘打包成签名 zip，发到本仓库的
  # keyboard-<版本> release 上（只含一个 feelime-keyboard-<版本>.zip
  # 资产，应用内更新检查读的就是 releases/latest）。
  # 签名身份：FEELIME_SIGNING_KEY（Ed25519 私钥 PEM 内容）+
  # FEELIME_KEY_ID（feelime-fork-2026-11），与 ReleaseKeys.kt 的
  # fork 公钥对应；上游的包从此验不过（键盘已领先上游，无需再收
  # 上游包）。同一键盘版本只发一次；改键盘必须先 bump VERSION。
  publish-keyboard:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish keyboard package
        env:
          SIGNING_KEY: ${{ secrets.FEELIME_SIGNING_KEY }}
          KEY_ID: ${{ secrets.FEELIME_KEY_ID }}
          # `gh` is not pre-authenticated on the runner; without this both
          # `gh release view` and `gh release create` fail (exit code 4).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\n' < app/src/main/assets/keyboard/VERSION)
          TAG="keyboard-$VERSION"
          ZIP="feelime-keyboard-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          if [ -z "$SIGNING_KEY" ]; then
            echo "FEELIME_SIGNING_KEY secret is not configured; cannot publish." >&2
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" > /tmp/feelime-signing-key.pem
          FEELIME_SIGNING_KEY=/tmp/feelime-signing-key.pem \
            FEELIME_KEY_ID="${KEY_ID:-feelime-fork-2026-11}" \
            ./scripts/package-keyboard.sh "$ZIP"
          gh release create "$TAG" \
            --title "键盘热更包 $VERSION" \
            --notes "Feelime 键盘热更包（fork 自有签名通道）。应用内设置页 → 检查更新即可拉取；也可手动下载后用设置页的安装包地址安装。" \
            "$ZIP"

